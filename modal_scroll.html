<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scroll Modal</title>

    <!-- ✅ Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="height:2000px;"> <!-- scroll ke liye height -->

<!-- Modal -->
<div class="modal fade" id="scrollModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      
      <div class="modal-header">
        <h5 class="modal-title">Welcome 🎉</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      
      <div class="modal-body">
        You have scrolled down! 🚀
      </div>
      
    </div>
  </div>
</div>

<!-- ✅ Bootstrap JS (IMPORTANT) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script>
let shown = false;

window.addEventListener('scroll', function() {

    let scrollTop = window.scrollY;
    let windowHeight = window.innerHeight;
    let docHeight = document.body.scrollHeight;

    if(!shown && scrollTop + windowHeight >= docHeight * 0.5){

        let myModal = new bootstrap.Modal(document.getElementById('scrollModal'));
        myModal.show();

        shown = true;
    }
});
</script>

</body>
</html>
