<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!-- text -->
    <p id="p1">hey Manal</p>
    <input type="button" value="click" id="button">

<br>
<br>
    <!-- html() -->
    <input type="button" value="click me" id="button2">

<br>
<br>
    <!-- val -->
     <input type="text" placeholder="your name" id="txt1">


    <input type="button" value="click me" id="button3">


    <script src="jquery.js"></script>
    <script>
        $(document).ready(function(){
            $("#button").click(function()
                {
                    $("#p1").text("Learning Never Ends");
                });

        });
        // html

        $(document).ready(function(){
            $("#button2").click(function()
                {
                    $("#p1").html("Learning <b style='background-color: yellow;'>Never</b> Ends");
                });

        });

        // val

        // $(document).ready(function(){
        //     $("#button3").click(function(){
        //         $("#txt1").val("Muhammad")
        //     })
        // });
        
        $(document).ready(function(){
            $("#button3").click(function(){
                var name = $("#txt1").val();   // user ka input get karo
                $("#p1").text("Hey " + name);  // paragraph me show karo
            })
        });
    </script>
    
</body>
</html>
