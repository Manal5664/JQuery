<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clone Method</title>
    <style>
        .box{
            height: 150px;
            width: 250px;
            border: 5px solid black;
            background-color: rgb(106, 106, 131);
        }
        .cloned{
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div id="div1" class="box">
        <h1>this is heading</h1>
        <p>this is paragraph</p>
    </div>
    <br><br>

    <input type="button" value="Clone" id="btnClone">
    <input type="button" value="Remove Last Clone" id="btnRemoveLast">
    <input type="button" value="Remove All Clones" id="btnRemoveAll">

    <div id="cloneArea"></div>

    <script src="jquery.js"></script>
    <script>
        $(document).ready(function(){
            $("#btnClone").click(function(){
                $("#div1")
                    .clone() // yee div1 ki exact copy banaega
                    .removeAttr("id")
                    .addClass("cloned")
                    .appendTo("#cloneArea");
            });

            $("#btnRemoveLast").click(function(){
                $("#cloneArea .cloned").last().remove();
            });

            $("#btnRemoveAll").click(function(){
                $("#cloneArea").empty();
            });
        });
    </script>
</body>
</html>
