<!DOCTYPE html>
<html>
<head>
    <title>Social Stats</title>

    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
        }

        .container {
            display: flex;
            justify-content: space-around;
            background: white;
            padding: 20px;
            width: 80%;
            margin: 50px auto;
            border-radius: 10px;
        }

        .box {
            text-align: center;
            border-right: 1px solid #ddd;
            padding: 10px 20px;
        }

        .icon {
            font-size: 30px;
            margin-bottom: 5px;
        }

        .number {
            font-size: 20px;
            font-weight: bold;
        }

        .text {
            color: gray;
            font-size: 14px;
        }

        /* Colors */
        .fb { color: #1877f2; }
        .insta { color: #e4405f; }
        .tw { color: #1da1f2; }
        .yt { color: red; }
        .li { color: #0077b5; }
    </style>
</head>
<body>

<div class="container">

    <div class="box">
        <div class="icon fb"><i class="fab fa-facebook"></i></div>
        <div class="number counter">100</div>
        <div class="text">Friends</div>
    </div>

    <div class="box">
        <div class="icon insta"><i class="fab fa-instagram"></i></div>
        <div class="number counter">10</div>
        <div class="text">Followers</div>
    </div>

    <div class="box">
        <div class="icon tw"><i class="fab fa-twitter"></i></div>
        <div class="number counter">50</div>
        <div class="text">Followers</div>
    </div>

    <div class="box">
        <div class="icon yt"><i class="fab fa-youtube"></i></div>
        <div class="number counter">50</div>
        <div class="text">Subscribers</div>
    </div>

    <div class="box">
        <div class="icon li"><i class="fab fa-linkedin"></i></div>
        <div class="number counter">15</div>
        <div class="text">Connections</div>
    </div>

</div>

<!-- jQuery and CounterUp scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/waypoints/4.0.1/jquery.waypoints.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Counter-Up/1.0.0/jquery.counterup.min.js"></script>
<script>
$(document).ready(function() {
    $('.counter').counterUp({
        delay: 10,
        time: 3000
    });
});
</script>
</body>
</html>
